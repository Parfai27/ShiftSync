spring.application.name=shiftsync-backend

spring.datasource.url=${SHIFT_SYNC_DB_URL:jdbc:postgresql://localhost:5432/shiftsync}
spring.datasource.username=${SHIFT_SYNC_DB_USERNAME:postgres}
spring.datasource.password=${SHIFT_SYNC_DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Kigali
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SHIFT_SYNC_SERVER_PORT:8080}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
