spring.application.name=shiftsync-backend

spring.datasource.url=${SHIFT_SYNC_DB_URL:jdbc:postgresql://localhost:5432/shiftsync}
spring.datasource.username=${SHIFT_SYNC_DB_USERNAME:postgres}
spring.datasource.password=${SHIFT_SYNC_DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Kigali
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SHIFT_SYNC_SERVER_PORT:8080}
app.frontend.url=${SHIFT_SYNC_FRONTEND_URL:http://localhost:5173}

spring.mail.host=${SHIFT_SYNC_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SHIFT_SYNC_MAIL_PORT:587}
spring.mail.username=${SHIFT_SYNC_MAIL_USERNAME:mugwanezaparfait@gmail.com}
spring.mail.password=${SHIFT_SYNC_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SHIFT_SYNC_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SHIFT_SYNC_MAIL_STARTTLS:true}
app.mail.from=${SHIFT_SYNC_MAIL_FROM:mugwanezaparfait@gmail.com}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
